name: build-binary

on:
  pull_request:
    paths:
      - Cargo.lock
      - Cargo.toml
      - src/**
      - .github/workflows/build-binary.yml
  push:
    branches:
      - main
    paths:
      - Cargo.lock
      - Cargo.toml
      - src/**
      - .github/workflows/build-binary.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-binary::${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Build Linux ${{ matrix.arch }} binary
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache cargo artifacts
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Build release binary
        run: cargo build --release --locked

      - name: Stage binary artifact
        run: |
          set -euo pipefail
          artifact="mcp-probe-linux-${{ matrix.arch }}"
          mkdir -p "dist/package" "dist/verify"
          install -m 0755 target/release/mcp-probe "dist/package/${artifact}"

          test "$(stat -c '%a' "dist/package/${artifact}")" = 755
          case "${{ matrix.arch }}" in
            x86_64) expected_machine='Advanced Micro Devices X86-64' ;;
            aarch64) expected_machine='AArch64' ;;
            *) echo "unsupported architecture: ${{ matrix.arch }}" >&2; exit 1 ;;
          esac
          readelf -h "dist/package/${artifact}" | grep -F "Machine:" | grep -F "$expected_machine"

          (
            cd dist/package
            sha256sum "$artifact" > "${artifact}.sha256"
            sha256sum -c "${artifact}.sha256"
            tar -czf "../${artifact}.tar.gz" "$artifact" "${artifact}.sha256"
          )
          (
            cd dist
            sha256sum "${artifact}.tar.gz" > "${artifact}.tar.gz.sha256"
            sha256sum -c "${artifact}.tar.gz.sha256"
          )

          tar -xzf "dist/${artifact}.tar.gz" -C dist/verify
          test "$(stat -c '%a' "dist/verify/${artifact}")" = 755
          (
            cd dist/verify
            sha256sum -c "${artifact}.sha256"
          )
          readelf -h "dist/verify/${artifact}" | grep -F "Machine:" | grep -F "$expected_machine"

      - name: Upload binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mcp-probe-linux-${{ matrix.arch }}
          path: |
            dist/mcp-probe-linux-${{ matrix.arch }}.tar.gz
            dist/mcp-probe-linux-${{ matrix.arch }}.tar.gz.sha256
          if-no-files-found: error
