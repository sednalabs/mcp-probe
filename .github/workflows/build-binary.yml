name: build-binary

on:
  pull_request:
    paths:
      - Cargo.lock
      - Cargo.toml
      - src/**
      - .github/workflows/build-binary.yml
  push:
    branches:
      - main
    paths:
      - Cargo.lock
      - Cargo.toml
      - src/**
      - .github/workflows/build-binary.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-binary::${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Build Linux ${{ matrix.arch }} binary
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache cargo artifacts
        uses: swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - name: Build release binary
        run: cargo build --release --locked

      - name: Stage binary artifact
        run: |
          set -euo pipefail
          artifact="mcp-probe-${GITHUB_SHA}-linux-${{ matrix.arch }}"
          mkdir -p "dist/package" "dist/verify"
          install -m 0755 target/release/mcp-probe "dist/package/${artifact}"

          test "$(stat -c '%a' "dist/package/${artifact}")" = 755
          case "${{ matrix.arch }}" in
            x86_64) expected_machine='Advanced Micro Devices X86-64' ;;
            aarch64) expected_machine='AArch64' ;;
            *) echo "unsupported architecture: ${{ matrix.arch }}" >&2; exit 1 ;;
          esac
          readelf -h "dist/package/${artifact}" | grep -F "Machine:" | grep -F "$expected_machine"
          required_glibc="$({ readelf --version-info "dist/package/${artifact}" || true; } \
            | grep -oE 'GLIBC_[0-9]+\.[0-9]+' \
            | sed 's/^GLIBC_//' \
            | sort -Vu \
            | tail -n 1)"
          test "$required_glibc" = 2.39

          printf '%s\n' \
            'format-version=1' \
            'target-os=linux' \
            'target-arch=${{ matrix.arch }}' \
            'libc=glibc' \
            "minimum-glibc=${required_glibc}" \
            "source-commit=${GITHUB_SHA}" \
            > "dist/package/${artifact}.build-info"

          (
            cd dist/package
            sha256sum "$artifact" "${artifact}.build-info" > "${artifact}.sha256"
            sha256sum -c "${artifact}.sha256"
            tar -czf "../${artifact}.tar.gz" \
              "$artifact" \
              "${artifact}.build-info" \
              "${artifact}.sha256"
          )
          (
            cd dist
            sha256sum "${artifact}.tar.gz" > "${artifact}.tar.gz.sha256"
            sha256sum -c "${artifact}.tar.gz.sha256"
          )

          tar -xzf "dist/${artifact}.tar.gz" -C dist/verify
          test "$(stat -c '%a' "dist/verify/${artifact}")" = 755
          (
            cd dist/verify
            sha256sum -c "${artifact}.sha256"
          )
          readelf -h "dist/verify/${artifact}" | grep -F "Machine:" | grep -F "$expected_machine"
          grep -Fx 'target-os=linux' "dist/verify/${artifact}.build-info"
          grep -Fx 'target-arch=${{ matrix.arch }}' "dist/verify/${artifact}.build-info"
          grep -Fx 'libc=glibc' "dist/verify/${artifact}.build-info"
          grep -Fx 'minimum-glibc=2.39' "dist/verify/${artifact}.build-info"
          grep -Fx "source-commit=${GITHUB_SHA}" "dist/verify/${artifact}.build-info"

      - name: Upload binary artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mcp-probe-${{ github.sha }}-linux-${{ matrix.arch }}
          path: |
            dist/mcp-probe-${{ github.sha }}-linux-${{ matrix.arch }}.tar.gz
            dist/mcp-probe-${{ github.sha }}-linux-${{ matrix.arch }}.tar.gz.sha256
          if-no-files-found: error
